<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltos del dedo</title>
<style>
  :root { --fondo:#0b1633; --panel:#13224a; --azul:#3d7bff; --blanco:#f3f6ff; --gris:#9fb0d8; --oro:#f2c14e; --rojo:#ff5a5a; --verde:#4cd38a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--blanco); font-family:system-ui, Segoe UI, sans-serif; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--gris); margin:0 0 14px; font-size:14px; }
  .botones { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button { background:var(--panel); color:var(--blanco); border:2px solid #2a3d73; border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button.activo { border-color:var(--oro); background:#1c2f63; }
  .escena { background:#0e1d44; border-radius:14px; overflow:hidden; max-width:900px; }
  svg { width:100%; height:auto; display:block; }
  .info { max-width:900px; margin-top:12px; background:var(--panel); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.45; }
  .info b { color:var(--oro); }
  .res { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:14px; }
  .ok { color:var(--verde); } .mal { color:var(--rojo); }
  .repetir { margin-top:10px; }
</style>
</head>
<body>
<h1>Saltos del dedo: elige una opción</h1>
<p class="sub">Simulación: la cámara pierde la mano un momento y además ve una «mano falsa» lejos durante 1 cuadro (como en tu video).</p>

<div class="botones" id="botones">
  <button data-op="hoy">Como está hoy</button>
  <button data-op="a">A · Cortar la línea en el salto</button>
  <button data-op="b">B · No creer un punto suelto lejano</button>
  <button data-op="c">C · A + B (recomendada)</button>
</div>

<div class="escena">
<svg viewBox="0 0 800 420" id="svg">
  <circle cx="680" cy="70" r="30" fill="#fff4c8"/>
  <path d="M0 360 L60 320 L110 350 L170 300 L240 345 L300 310 L370 350 L440 305 L520 345 L590 300 L660 345 L730 310 L800 340 L800 420 L0 420Z" fill="#132a55"/>
  <g id="frutas"></g>
  <g id="rastro"></g>
  <circle id="cursor" r="9" fill="none" stroke="#fff" stroke-width="3" opacity="0"/>
</svg>
</div>

<div class="info" id="info"></div>
<button class="repetir" id="repetir">▶ Repetir</button>

<script>
// camino real del dedo (15 cuadros por segundo)
const real = [];
for (let i = 0; i < 46; i++) real.push([60 + i * 15, 230 - Math.sin(i / 7) * 110]);
const PERDIDO = [22, 23, 24, 25];   // cuadros sin mano
const FALSO = 26;                   // cuadro con mano falsa lejos
const PUNTO_FALSO = [720, 380];

const textos = {
  hoy: ["<b>Como está hoy:</b> mientras no ve la mano, el puntero se queda quieto; cuando la vuelve a ver (o ve la mano falsa) dibuja una línea larga de un salto y corta todo lo que hay en medio.",
        [["Corta la bomba sin querer", false], ["Línea larga rara", false], ["Sin retraso", true]]],
  a:   ["<b>A:</b> si el dedo «viaja» más rápido de lo que una mano puede, se empieza una línea nueva en vez de unir los dos puntos. No se corta nada en el salto.",
        [["No corta la bomba", true], ["Sin línea larga", true], ["El puntero parpadea a la mano falsa 1 cuadro", false]]],
  b:   ["<b>B:</b> un punto que aparece lejos solo se acepta si el cuadro siguiente lo confirma. La mano falsa de 1 cuadro se ignora.",
        [["Ignora la mano falsa", true], ["Al volver la mano sí dibuja una línea larga", false], ["Espera 1 cuadro (0,07 s) solo tras perder la mano", true]]],
  c:   ["<b>C (A + B):</b> ignora la mano falsa y, cuando la mano real vuelve lejos, empieza una línea nueva sin cortar nada en el salto.",
        [["No corta la bomba", true], ["Sin línea larga ni parpadeo", true], ["Espera 1 cuadro (0,07 s) solo tras perder la mano", true]]]
};

const NS = "http://www.w3.org/2000/svg";
const frutas = [
  { x: 60 + 13 * 15, y: 230 - Math.sin(13 / 7) * 110, tipo: "fruta" },
  { x: 60 + 36 * 15, y: 230 - Math.sin(36 / 7) * 110, tipo: "fruta" },
  { x: 560, y: 303, tipo: "bomba" }
];
let op = "c", timer = null;

function puntos(op) {
  // devuelve lista de cuadros: {p:[x,y]|null, nueva:bool}
  const out = [];
  let ultimo = null, pendiente = null;
  for (let i = 0; i < real.length; i++) {
    let p = PERDIDO.includes(i) ? null : (i === FALSO ? PUNTO_FALSO : real[i]);
    if (p === null) { out.push({ p: null }); continue; }
    const lejos = ultimo && Math.hypot(p[0] - ultimo[0], p[1] - ultimo[1]) > 120;
    if ((op === "b" || op === "c") && lejos) {
      if (!pendiente || Math.hypot(p[0] - pendiente[0], p[1] - pendiente[1]) > 60) { pendiente = p; out.push({ p: null }); continue; }
    }
    pendiente = null;
    const nueva = (op === "a" || op === "c") && ultimo && Math.hypot(p[0] - ultimo[0], p[1] - ultimo[1]) > 120;
    out.push({ p, nueva });
    ultimo = p;
  }
  return out;
}

function corta(a, b, f) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((f.x - a[0]) * dx + (f.y - a[1]) * dy) / L));
  return Math.hypot(a[0] + dx * t - f.x, a[1] + dy * t - f.y) < 22;
}

function dibujarFrutas() {
  const g = document.getElementById("frutas"); g.innerHTML = "";
  frutas.forEach(f => {
    f.cortada = false;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", f.x); c.setAttribute("cy", f.y); c.setAttribute("r", 20);
    c.setAttribute("fill", f.tipo === "bomba" ? "#222a3a" : "#ff9f2e");
    c.setAttribute("stroke", f.tipo === "bomba" ? "#ff5a5a" : "#ffd08a"); c.setAttribute("stroke-width", 3);
    f.el = c; g.appendChild(c);
    if (f.tipo === "bomba") {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", f.x); t.setAttribute("y", f.y + 6); t.setAttribute("text-anchor", "middle");
      t.setAttribute("fill", "#ff5a5a"); t.setAttribute("font-size", 16); t.setAttribute("font-weight", 700); t.textContent = "!";
      g.appendChild(t);
    }
  });
}

function correr() {
  clearInterval(timer);
  document.querySelectorAll("#botones button").forEach(b => b.classList.toggle("activo", b.dataset.op === op));
  const [txt, res] = textos[op];
  document.getElementById("info").innerHTML = txt + '<div class="res">' +
    res.map(([t, ok]) => `<span class="${ok ? "ok" : "mal"}">${ok ? "✔" : "✘"} ${t}</span>`).join("") + "</div>";
  dibujarFrutas();
  const g = document.getElementById("rastro"); g.innerHTML = "";
  const cur = document.getElementById("cursor");
  const lista = puntos(op);
  let i = 0, ant = null;
  timer = setInterval(() => {
    if (i >= lista.length) { clearInterval(timer); return; }
    const { p, nueva } = lista[i++];
    if (!p) return;                       // hoy: el puntero se queda donde estaba
    if (ant && !nueva) {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", ant[0]); l.setAttribute("y1", ant[1]); l.setAttribute("x2", p[0]); l.setAttribute("y2", p[1]);
      l.setAttribute("stroke", "#bcd4ff"); l.setAttribute("stroke-width", 4); l.setAttribute("stroke-linecap", "round");
      g.appendChild(l);
      frutas.forEach(f => {
        if (!f.cortada && corta(ant, p, f)) {
          f.cortada = true;
          f.el.setAttribute("fill", f.tipo === "bomba" ? "#ff5a5a" : "#4cd38a");
          f.el.setAttribute("r", 26);
        }
      });
    }
    cur.setAttribute("cx", p[0]); cur.setAttribute("cy", p[1]); cur.setAttribute("opacity", 1);
    ant = p;
  }, 90);
}

document.querySelectorAll("#botones button").forEach(b => b.onclick = () => { op = b.dataset.op; correr(); });
document.getElementById("repetir").onclick = correr;
correr();
</script>
</body>
</html>
