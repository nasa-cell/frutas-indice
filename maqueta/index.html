<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corte Frutal · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--letra:"M PLUS Rounded 1c";--peso:800;--ui:#1d3d8f;--acc:#e8b923;--panel:rgba(255,255,255,.88);--txt:#1d3d8f;--borde:#1d3d8f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d1b3d;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#lienzo{position:fixed;inset:0;width:100vw;height:100dvh;display:block;cursor:crosshair}
#barra{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:20;flex-wrap:wrap;justify-content:center}
#barra button{font:inherit;font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px;border:2px solid #fff;background:rgba(13,27,61,.75);color:#fff;cursor:pointer}
#barra select{font:inherit;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;border:2px solid #ffd85a;background:#0d1b3d;color:#ffd85a;cursor:pointer;max-width:46vw}
#barra button.activo{background:#fff;color:#1d3d8f}
#barra .sep{width:1px;background:rgba(255,255,255,.4);margin:0 2px}
.pantalla{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;padding:16px;pointer-events:none}
.pantalla.ver{display:flex}
.tarjeta{pointer-events:auto;background:var(--panel);border:3px solid var(--borde);border-radius:26px;padding:26px 28px;text-align:center;color:var(--txt);max-width:420px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.tarjeta h1{font-family:var(--letra),sans-serif;font-size:clamp(34px,8vw,54px);line-height:1.1;font-weight:var(--peso);color:#ffd85a;letter-spacing:.5px;text-shadow:3px 0 #2a1600,-3px 0 #2a1600,0 3px #2a1600,0 -3px #2a1600,2px 2px #2a1600,-2px -2px #2a1600,2px -2px #2a1600,-2px 2px #2a1600,0 7px 0 #b8860b,0 10px 16px rgba(0,0,0,.55)}
.tarjeta p{margin:12px 0;font-size:16px;font-weight:500}
.tarjeta .grande{font-family:var(--letra),sans-serif;font-size:52px;font-weight:var(--peso);color:#fff;text-shadow:0 4px 0 #b8860b}
.tarjeta .boton{font-family:var(--letra),sans-serif;font-weight:var(--peso);font-size:20px;margin-top:10px;padding:12px 30px;border-radius:999px;border:3px solid var(--borde);background:var(--acc);color:#1b1b1b;cursor:pointer;box-shadow:0 5px 0 var(--borde)}
.tarjeta .boton:active{transform:translateY(4px);box-shadow:0 1px 0 var(--borde)}
.tarjeta .chico{font-size:13px;opacity:.8}
.tarjeta .boton.secundario{font-size:15px;padding:9px 20px;margin-top:14px;background:transparent;color:var(--txt);box-shadow:none}
.tarjeta .mano{font-size:44px;margin:6px 0}
@media (max-width:600px){#barra{gap:4px;top:6px}#barra button,#barra select{font-size:11px;padding:5px 8px}#barra .sep{display:none}}
#nota{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;color:#fff;background:rgba(13,27,61,.7);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<div id="barra">
  <button id="camBarra">📷 Cámara</button>
  <span class="sep"></span>
  <button data-pan="inicio" class="activo">Inicio</button>
  <button data-pan="juego">Juego</button>
  <button data-pan="fin">Game Over</button>
  <button data-pan="galeria">Frutas</button>
</div>

<div class="pantalla ver" id="p-inicio"><div class="tarjeta">
  <h1>Corte Frutal</h1>
  <p class="mano">☝️</p>
  <p>Levanta tu <b>dedo índice</b> frente a la cámara y corta las frutas.<br>No toques las bombas.</p>
  <p class="chico">Récord: <b id="rec1">0</b> · 60 segundos · 3 vidas</p>
  <button class="boton" data-ir="juego">Jugar</button><br>
  <button class="boton secundario" id="camInicio">📷 Encender cámara</button>
</div></div>

<div class="pantalla" id="p-fin"><div class="tarjeta">
  <h1>¡Se acabó!</h1>
  <p>Puntos</p>
  <p class="grande" id="ptsFin">0</p>
  <p class="chico">Récord: <b id="rec2">0</b> · Mejor combo: <b id="comboFin">0</b></p>
  <button class="boton" data-ir="juego">Jugar otra vez</button>
</div></div>

<div id="nota">Toca «📷 Cámara» para jugar con tu dedo índice · también funciona con el mouse</div>

<script>
(()=>{
const cv=document.getElementById('lienzo'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,K=1,TOP=52,LETRA='"M PLUS Rounded 1c"',PESO=800;
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function semilla(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- dibujo estilo anime: contorno fino + sombra de dos tonos + brillos ---------- */
function cel(c,r,path,base,sombra,linea,lx=-.13,ly=-.15){
  c.save();path(c,r);c.fillStyle=sombra;c.fill();c.clip();
  c.save();c.translate(lx*r,ly*r);c.scale(.95,.95);path(c,r);c.fillStyle=base;c.fill();c.restore();
  const g=c.createRadialGradient(-.35*r,-.4*r,0,-.35*r,-.4*r,r*1.1);
  g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g;c.fillRect(-2*r,-2*r,4*r,4*r);
  c.restore();
}
function borde(c,r,path,linea,w=.055){c.save();path(c,r);c.lineWidth=Math.max(1.5,r*w);c.strokeStyle=linea;c.lineJoin='round';c.stroke();c.restore()}
function brillo(c,x,y,w,h,rot=-.6,a=.92){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=`rgba(255,255,255,${a})`;c.beginPath();c.ellipse(0,0,w,h,0,0,TAU);c.fill();c.restore()}
function hoja(c,x,y,l,ang,col='#5cb83a',som='#2f7a1f',lin='#24501a'){
  c.save();c.translate(x,y);c.rotate(ang);
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(l*.5,-l*.42,l,0);c.quadraticCurveTo(l*.5,l*.42,0,0);
  c.fillStyle=col;c.fill();
  c.save();c.clip();c.fillStyle=som;c.fillRect(0,0,l,l);c.restore();
  c.lineWidth=Math.max(1.2,l*.07);c.strokeStyle=lin;c.stroke();
  c.beginPath();c.moveTo(l*.08,0);c.lineTo(l*.85,0);c.lineWidth=Math.max(1,l*.04);c.stroke();
  c.restore();
}
function tallo(c,x1,y1,x2,y2,w,col='#6b4423',lin='#3b230f'){
  c.save();c.lineCap='round';c.strokeStyle=lin;c.lineWidth=w+2;c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo((x1+x2)/2+w,(y1+y2)/2,x2,y2);c.stroke();
  c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore();
}
function gota(c,x,y,s,ang,col,lin){c.save();c.translate(x,y);c.rotate(ang);c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*.8,s*.2,0,s*.7);c.quadraticCurveTo(-s*.8,s*.2,0,-s);c.fillStyle=col;c.fill();if(lin){c.lineWidth=Math.max(.8,s*.18);c.strokeStyle=lin;c.stroke()}c.restore()}

/* formas */
const P={
  circulo:(c,r)=>{c.beginPath();c.arc(0,0,r,0,TAU)},
  manzana:(c,r)=>{c.beginPath();c.moveTo(0,-.62*r);c.bezierCurveTo(.25*r,-.92*r,.98*r,-.85*r,.96*r,-.1*r);c.bezierCurveTo(.93*r,.6*r,.45*r,.96*r,.18*r,.88*r);c.bezierCurveTo(.08*r,.84*r,-.08*r,.84*r,-.18*r,.88*r);c.bezierCurveTo(-.45*r,.96*r,-.93*r,.6*r,-.96*r,-.1*r);c.bezierCurveTo(-.98*r,-.85*r,-.25*r,-.92*r,0,-.62*r);c.closePath()},
  pera:(c,r)=>{c.beginPath();c.moveTo(0,-.95*r);c.bezierCurveTo(.3*r,-.96*r,.36*r,-.5*r,.45*r,-.22*r);c.bezierCurveTo(.92*r,.15*r,.86*r,.96*r,0,.96*r);c.bezierCurveTo(-.86*r,.96*r,-.92*r,.15*r,-.45*r,-.22*r);c.bezierCurveTo(-.36*r,-.5*r,-.3*r,-.96*r,0,-.95*r);c.closePath()},
  fresa:(c,r)=>{c.beginPath();c.moveTo(0,-.62*r);c.bezierCurveTo(.6*r,-.88*r,1.02*r,-.42*r,.82*r,.08*r);c.bezierCurveTo(.62*r,.6*r,.22*r,.96*r,0,1*r);c.bezierCurveTo(-.22*r,.96*r,-.62*r,.6*r,-.82*r,.08*r);c.bezierCurveTo(-1.02*r,-.42*r,-.6*r,-.88*r,0,-.62*r);c.closePath()},
  mango:(c,r)=>{c.beginPath();c.moveTo(-.92*r,0);c.bezierCurveTo(-.92*r,-.78*r,.5*r,-.88*r,.92*r,-.26*r);c.bezierCurveTo(1.12*r,.3*r,.62*r,.82*r,0,.76*r);c.bezierCurveTo(-.6*r,.74*r,-.92*r,.42*r,-.92*r,0);c.closePath()},
  limon:(c,r)=>{c.beginPath();c.moveTo(-1.02*r,0);c.bezierCurveTo(-.95*r,-.12*r,-.85*r,-.72*r,0,-.72*r);c.bezierCurveTo(.85*r,-.72*r,.95*r,-.12*r,1.02*r,0);c.bezierCurveTo(.95*r,.12*r,.85*r,.72*r,0,.72*r);c.bezierCurveTo(-.85*r,.72*r,-.95*r,.12*r,-1.02*r,0);c.closePath()},
  ovalo:(rx,ry)=>(c,r)=>{c.beginPath();c.ellipse(0,0,r*rx,r*ry,0,0,TAU)},
};
const esc=(path,s)=>(c,r)=>{c.save();c.scale(s,s);path(c,r);c.restore()};

/* corte genérico: cáscara + pulpa */
function corteBase(c,r,path,cascara,pulpa,linea,anillo=.88){
  c.save();path(c,r);c.fillStyle=cascara;c.fill();c.restore();
  c.save();c.scale(anillo,anillo);path(c,r);c.fillStyle=pulpa;c.fill();c.restore();
}

/* ---------- frutas ---------- */
const FRUTAS={
manzana:{r:44,jugo:'#fff1c4',var:[['#e8283a','#a8122a','#5a0a14'],['#8fd14f','#55a02a','#24501a'],['#f6d743','#d6a520','#6b4a0a']],
  entera(c,r,v,R){const [b,s,l]=v;cel(c,r,P.manzana,b,s,l);
    for(let i=0;i<22;i++){const a=R()*TAU,d=R()*.8*r;c.fillStyle='rgba(255,240,200,.45)';c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d*.9,r*.018,0,TAU);c.fill()}
    c.save();c.fillStyle=s;c.beginPath();c.ellipse(0,-.6*r,.16*r,.06*r,0,0,TAU);c.fill();c.restore();
    borde(c,r,P.manzana,l);tallo(c,0,-.58*r,.08*r,-.98*r,r*.07);hoja(c,.06*r,-.82*r,.42*r,-.5);
    brillo(c,-.48*r,-.38*r,.17*r,.08*r);brillo(c,-.26*r,-.52*r,.05*r,.035*r)},
  corte(c,r,v,R){const [b,s,l]=v;corteBase(c,r,P.manzana,b,'#fbf0cf',l,.9);
    c.fillStyle='rgba(230,205,140,.6)';c.beginPath();c.ellipse(0,.05*r,.32*r,.42*r,0,0,TAU);c.fill();
    for(let i=0;i<5;i++){const a=i/5*TAU-Math.PI/2;gota(c,Math.cos(a)*.17*r,.05*r+Math.sin(a)*.2*r,.09*r,a+Math.PI/2,'#5b3414','#2a1608')}
    borde(c,r,P.manzana,l)}},
naranja:{r:44,jugo:'#ffb43a',var:[['#ff9a1f','#e06a0c','#7a3506'],['#ffb02e','#ea7c10','#7a3a06']],
  entera(c,r,v,R){const [b,s,l]=v;cel(c,r,P.circulo,b,s,l);
    c.save();P.circulo(c,r);c.clip();for(let i=0;i<120;i++){const a=R()*TAU,d=Math.sqrt(R())*r;c.fillStyle=R()<.5?'rgba(160,60,0,.22)':'rgba(255,220,150,.35)';c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,r*.02,0,TAU);c.fill()}c.restore();
    borde(c,r,P.circulo,l);c.fillStyle='#4f7a1c';c.beginPath();c.arc(.05*r,-.86*r,.07*r,0,TAU);c.fill();
    if(R()<.6)hoja(c,.08*r,-.88*r,.4*r,-.3);brillo(c,-.45*r,-.42*r,.18*r,.08*r);brillo(c,-.22*r,-.6*r,.05*r,.035*r)},
  corte(c,r,v,R){const [b,s,l]=v;corteBase(c,r,P.circulo,b,'#fff3dc',l,.9);
    const n=9+Math.floor(R()*3);for(let i=0;i<n;i++){const a0=i/n*TAU+.04,a1=(i+1)/n*TAU-.04;c.beginPath();c.moveTo(Math.cos((a0+a1)/2)*.08*r,Math.sin((a0+a1)/2)*.08*r);c.arc(0,0,.8*r,a0,a1);c.closePath();c.fillStyle='#ffa42a';c.fill();
      c.save();c.clip();c.fillStyle='rgba(255,230,160,.5)';c.beginPath();c.arc(Math.cos((a0+a1)/2)*.5*r,Math.sin((a0+a1)/2)*.5*r,.12*r,0,TAU);c.fill();c.restore()}
    borde(c,r,P.circulo,l)}},
limon:{r:38,jugo:'#fff27a',var:[['#ffe84a','#e6c21a','#7a6006'],['#b8e04a','#86b51f','#3d5a0a']],
  entera(c,r,v,R){const [b,s,l]=v;cel(c,r,P.limon,b,s,l);
    c.save();P.limon(c,r);c.clip();for(let i=0;i<80;i++){c.fillStyle='rgba(150,120,0,.2)';c.beginPath();c.arc(rnd(-r,r),rnd(-.7*r,.7*r),r*.02,0,TAU);c.fill()}c.restore();
    borde(c,r,P.limon,l);brillo(c,-.4*r,-.36*r,.22*r,.07*r,-.3)},
  corte(c,r,v,R){const [b,s,l]=v;const p=P.ovalo(.82,.72);corteBase(c,r,p,b,'#fffbe0',l,.9);
    for(let i=0;i<8;i++){const a0=i/8*TAU+.05,a1=(i+1)/8*TAU-.05;c.save();c.scale(.82,.72);c.beginPath();c.moveTo(0,0);c.arc(0,0,.8*r,a0,a1);c.closePath();c.fillStyle='#fff06a';c.fill();c.restore()}
    borde(c,r,p,l)}},
sandia:{r:62,jugo:'#ff4a5c',var:[['#4fb33a','#2d7a22','#173d10']],
  entera(c,r,v,R){const [b,s,l]=v;const p=P.ovalo(1,.82);cel(c,r,p,b,s,l);
    c.save();p(c,r);c.clip();c.strokeStyle='#1f5a17';c.lineWidth=r*.1;c.lineJoin='round';
    for(let i=-4;i<=4;i++){c.beginPath();const x0=i*.24*r;for(let y=-r;y<=r;y+=r*.12){const x=x0+Math.sin(y/r*3+i)*r*.05+(y/r)*x0*.25;y===-r?c.moveTo(x,y):c.lineTo(x+(R()-.5)*r*.05,y)}c.stroke()}c.restore();
    borde(c,r,p,l);brillo(c,-.5*r,-.42*r,.25*r,.09*r,-.4)},
  corte(c,r,v,R){const p=P.ovalo(1,.82);corteBase(c,r,p,'#2d7a22','#e9f7d2','#173d10',.94);
    c.save();c.scale(.86,.86);p(c,r);c.fillStyle='#ff3d50';c.fill();c.restore();
    c.save();c.scale(.6,.6);p(c,r);c.fillStyle='rgba(255,130,140,.5)';c.fill();c.restore();
    for(let i=0;i<14;i++){const a=R()*TAU,d=rnd(.3,.62)*r;gota(c,Math.cos(a)*d,Math.sin(a)*d*.82,.06*r,a+Math.PI/2,'#1a1210')}
    borde(c,r,p,'#173d10')}},
durazno:{r:42,jugo:'#ffc070',var:[['#ffab6b','#f0705a','#7a2f1a'],['#ffc27a','#f28a4a','#7a3a14']],
  entera(c,r,v,R){const [b,s,l]=v;cel(c,r,P.circulo,b,s,l);
    c.save();P.circulo(c,r);c.clip();const g=c.createRadialGradient(.35*r,.2*r,0,.35*r,.2*r,r);g.addColorStop(0,'rgba(220,40,50,.55)');g.addColorStop(1,'rgba(220,40,50,0)');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);c.restore();
    c.save();c.beginPath();c.moveTo(0,-r);c.bezierCurveTo(-.3*r,-.4*r,-.25*r,.4*r,.05*r,.95*r);c.lineWidth=r*.05;c.strokeStyle=s;c.stroke();c.restore();
    borde(c,r,P.circulo,l);hoja(c,0,-.92*r,.45*r,-.7);brillo(c,-.5*r,-.36*r,.14*r,.07*r)},
  corte(c,r,v,R){const [b,s,l]=v;corteBase(c,r,P.circulo,s,'#ffd24a',l,.92);
    c.fillStyle='rgba(240,90,40,.55)';c.beginPath();c.ellipse(0,0,.42*r,.52*r,0,0,TAU);c.fill();
    c.fillStyle='#8a4a22';c.beginPath();c.ellipse(0,0,.28*r,.38*r,0,0,TAU);c.fill();c.strokeStyle='#4a2410';c.lineWidth=r*.04;c.stroke();
    c.strokeStyle='rgba(70,30,10,.6)';c.lineWidth=r*.025;for(let i=0;i<5;i++){c.beginPath();c.moveTo(-.18*r,(-.25+i*.12)*r);c.lineTo(.18*r,(-.22+i*.12)*r);c.stroke()}
    borde(c,r,P.circulo,l)}},
kiwi:{r:34,jugo:'#9fe05a',var:[['#9a6a3a','#6b4423','#3b230f']],
  entera(c,r,v,R){const [b,s,l]=v;const p=P.ovalo(1,.8);cel(c,r,p,b,s,l);
    c.save();p(c,r);c.clip();c.strokeStyle='rgba(60,35,15,.45)';c.lineWidth=1;for(let i=0;i<160;i++){const x=rnd(-r,r),y=rnd(-r,r);c.beginPath();c.moveTo(x,y);c.lineTo(x+rnd(-2,2),y+rnd(1,3));c.stroke()}c.restore();
    borde(c,r,p,l);brillo(c,-.45*r,-.35*r,.18*r,.06*r,-.3,.6)},
  corte(c,r,v,R){const p=P.ovalo(1,.8);corteBase(c,r,p,'#7a5230','#7cc63a','#3b230f',.9);
    c.save();c.scale(.9,.9);p(c,r);c.clip();const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'#d8f59a');g.addColorStop(.35,'#a7e05a');g.addColorStop(1,'#5aa820');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);c.restore();
    c.strokeStyle='rgba(240,255,210,.55)';c.lineWidth=1;for(let i=0;i<40;i++){const a=i/40*TAU;c.beginPath();c.moveTo(Math.cos(a)*.22*r,Math.sin(a)*.18*r);c.lineTo(Math.cos(a)*.78*r,Math.sin(a)*.62*r);c.stroke()}
    c.fillStyle='#f6fbe6';c.beginPath();c.ellipse(0,0,.2*r,.15*r,0,0,TAU);c.fill();
    for(let i=0;i<34;i++){const a=i/34*TAU+R()*.1,d=rnd(.27,.36);gota(c,Math.cos(a)*d*r,Math.sin(a)*d*.8*r,.035*r,a+Math.PI/2,'#141010')}
    borde(c,r,p,'#3b230f')}},
pera:{r:44,jugo:'#f2f5b0',var:[['#c9dd4a','#94b02a','#465a10'],['#e8c45a','#c08a2a','#6b4410']],
  entera(c,r,v,R){const [b,s,l]=v;cel(c,r,P.pera,b,s,l);

  if(pantalla==='galeria'){
    const d=DIS[dis];ctx.textAlign='center';ctx.textBaseline='middle';
    gal.forEach(g=>{const s=g.img.width/DPR;ctx.drawImage(g.img,g.x-s/2,g.y-s/2,s,s);ctx.drawImage(g.cut,g.x-s/2,g.y2-s/2-g.r*.3,s,s);
      ctx.font=`${PESO} ${Math.max(11,g.r*.36)}px ${LETRA},sans-serif`;ctx.lineWidth=3;ctx.strokeStyle=dis==='C'?'#081430':'#fff';ctx.strokeText(NOMBRES[g.t],g.x,g.y+g.r*1.12);ctx.fillStyle=d.hud;ctx.fillText(NOMBRES[g.t],g.x,g.y+g.r*1.12)});
    ctx.font=`${PESO} ${W<600?12:15}px ${LETRA},sans-serif`;ctx.lineWidth=4;ctx.strokeStyle=dis==='C'?'#081430':'#fff';const txt=W<600?'Arriba entera · abajo cortada · toca: otros colores':'Arriba entera · abajo cortada · toca para cambiar colores';ctx.strokeText(txt,W/2,H-46);ctx.fillStyle=d.hud;ctx.fillText(txt,W/2,H-46);
  }else{
    if(pantalla==='juego'){tiempo-=dt;if(tiempo<=0){tiempo=0;finJuego()}}
    proxOla-=dt;if(proxOla<=0){ola();proxOla=pantalla==='juego'?rnd(.9,1.7):rnd(1.4,2.4)}
    manchas=manchas.filter(m=>(m.v-=dt)>0);manchas.forEach(dibMancha);
    for(const f of frutas){f.vy+=G()*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
      if(f.y>H+f.r*2&&f.vy>0&&!f.muerta){f.muerta=true}}
    frutas=frutas.filter(f=>!f.muerta);
    for(const f of frutas){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
      if(f.bomba)bombaDib(ctx,f.r,tGlobal);else{const s=f.img.width/DPR;ctx.drawImage(f.img,-s/2,-s/2,s,s)}ctx.restore()}
    for(const m of mitades){m.vy+=G()*dt;m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;m.v-=dt;
      ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.ang+m.rot*.4);ctx.beginPath();const s=m.img.width/DPR;ctx.rect(-s,m.lado>0?0:-s,2*s,s);ctx.clip();ctx.rotate(-m.ang);ctx.drawImage(m.img,-s/2,-s/2,s,s);ctx.restore()}
    mitades=mitades.filter(m=>m.y<H+m.r*3);
    for(const g of gotas){g.vy+=G()*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.v-=dt;ctx.globalAlpha=Math.max(0,g.v);ctx.fillStyle=g.col;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill()}
    ctx.globalAlpha=1;gotas=gotas.filter(g=>g.v>0);
    if(pantalla==='juego')hud();
  }
  for(const x of textos){x.v-=dt;x.y-=40*dt;ctx.globalAlpha=Math.min(1,x.v*2);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`${PESO} ${(x.grande?34:22)*Math.max(.8,K)}px ${LETRA},sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='#1b1b2a';ctx.strokeText(x.t,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.t,x.x,x.y)}
  ctx.globalAlpha=1;textos=textos.filter(x=>x.v>0);
  ctx.restore();
  /* la cámara da ~30 cuadros/s; aquí se rellena a 60 para que la espada sea fluida */
  const J=window.juego;
  if(J.objetivo){if(!J.dedo){J.dedo={...J.objetivo};rastro=[]}
    const k=1-Math.exp(-dt*55);J.dedo.x+=(J.objetivo.x-J.dedo.x)*k;J.dedo.y+=(J.objetivo.y-J.dedo.y)*k;mover(J.dedo.x,J.dedo.y)}
  else if(J.dedo){J.dedo=null;rastro=[]}
  dibRastro();
  if(pantalla!=='galeria'){dibCam();dibDedo()}
  requestAnimationFrame(cuadro);
}

/* ---------- pantallas ---------- */
function irA(p){
  pantalla=p;document.querySelectorAll('.pantalla').forEach(e=>e.classList.remove('ver'));
  const el=document.getElementById('p-'+p);if(el)el.classList.add('ver');
  document.querySelectorAll('[data-pan]').forEach(b=>b.classList.toggle('activo',b.dataset.pan===p));
  document.getElementById('rec1').textContent=record;document.getElementById('rec2').textContent=record;
  document.getElementById('ptsFin').textContent=puntos;document.getElementById('comboFin').textContent=mejorCombo;
  if(p==='juego')reiniciar();
  if(p==='galeria'){frutas=[];mitades=[];armarGaleria()}
  if(p==='inicio'||p==='fin'){frutas=[];proxOla=.3}
}
document.querySelectorAll('[data-pan]').forEach(b=>b.onclick=()=>{if(b.dataset.pan==='fin'&&pantalla!=='juego'){puntos=puntos||37;mejorCombo=mejorCombo||4}irA(b.dataset.pan)});
document.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>irA(b.dataset.ir));
document.querySelectorAll('[data-dis]').forEach(b=>b.onclick=()=>{dis=b.dataset.dis;document.querySelectorAll('[data-dis]').forEach(x=>x.classList.toggle('activo',x===b));aplicarCSS();pintarFondo()});
const LETRAS=[['"M PLUS Rounded 1c"',800],['"Mochiy Pop One"',400],['"Dela Gothic One"',400],['"Bungee"',400]];
document.querySelectorAll('[data-letra]').forEach(b=>b.onclick=()=>{const[l,p]=LETRAS[+b.dataset.letra];LETRA=l;PESO=p;
  const s=document.documentElement.style;s.setProperty('--letra',l);s.setProperty('--peso',p);
  document.querySelectorAll('[data-letra]').forEach(x=>x.classList.toggle('activo',x===b));
  document.fonts&&document.fonts.load(`${p} 20px ${l}`).then(()=>{if(pantalla==='galeria')armarGaleria()})});
cv.addEventListener('click',()=>{if(pantalla==='galeria')armarGaleria()});

function medir(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  K=Math.max(.6,Math.min(1.25,Math.min(W,H)/700));TOP=document.getElementById('barra').getBoundingClientRect().bottom+8;
  initFondo();
  pintarFondo();if(pantalla==='galeria')armarGaleria();
}
addEventListener('resize',medir);medir();aplicarCSS();
document.fonts&&document.fonts.ready.then(()=>{});
requestAnimationFrame(cuadro);
})();
</script>
<script type="module">
const VER='0.10.14',BASE=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`;
const MODELO='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const nota=document.getElementById('nota'),J=window.juego;
let det=null,video=null,ult=-1,suave=null,cargando=false;
const avisar=t=>{nota.textContent=t};
async function encender(){
  if(video||cargando)return;cargando=true;
  try{
    avisar('Pidiendo permiso para la cámara…');
    let flujo;try{flujo=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60},facingMode:'user'},audio:false})}catch(e){if(e.name!=='OverconstrainedError')throw e;flujo=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
    video=document.createElement('video');video.playsInline=true;video.muted=true;video.srcObject=flujo;await video.play();J.video=video;
    avisar('Cargando el detector de manos (MediaPipe)…');
    const {HandLandmarker,FilesetResolver}=await import(`${BASE}/vision_bundle.mjs`);
    const fs=await FilesetResolver.forVisionTasks(`${BASE}/wasm`);
    const op=d=>({baseOptions:{modelAssetPath:MODELO,delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.4,minHandPresenceConfidence:.4,minTrackingConfidence:.4});
    try{det=await HandLandmarker.createFromOptions(fs,op('GPU'))}catch(e){det=await HandLandmarker.createFromOptions(fs,op('CPU'))}
    avisar('Cámara lista: mueve tu dedo índice para cortar');
    document.querySelectorAll('#camInicio,#camBarra').forEach(b=>{b.textContent='📷 Cámara encendida';b.classList.add('activo')});
    requestAnimationFrame(bucle);
  }catch(e){
    console.error(e);
    avisar(e.name==='NotAllowedError'?'No diste permiso a la cámara: actívalo en el candado de la barra de direcciones':
      e.name==='NotFoundError'?'No se encontró ninguna cámara conectada':'No se pudo cargar el detector (¿hay internet?): '+(e.message||e));
  }finally{cargando=false}
}
/* Filtro «One Euro»: quieto = sin temblor, rápido = sin retraso */
function filtro(minCorte=1.2,beta=.03,dCorte=1){
  let x=null,dx=0,t0=0;const a=(c,dt)=>1/(1+1/(2*Math.PI*c*dt));
  return{reset(){x=null},paso(v,t){if(x===null){x=v;t0=t;return v}const dt=Math.max(1e-3,(t-t0)/1000);t0=t;
    const d=(v-x)/dt;dx+=a(dCorte,dt)*(d-dx);const c=minCorte+beta*Math.abs(dx);x+=a(c,dt)*(v-x);return x}};
}
const fx=filtro(),fy=filtro();
const recorte=document.createElement('canvas'),rc=recorte.getContext('2d');
const lim=(v,a,b)=>Math.min(b,Math.max(a,v));
/* zoom digital: si la mano está lejos se mira solo la zona de la mano, así el detector la ve más grande */
let zona={cx:.5,cy:.5,z:1},tamMano=.22,buscar=0,perdida=0,cuadros=0,tFps=performance.now();
const BUSQUEDA=[[.5,.5,1],[.5,.45,.62],[.5,.45,.45],[.32,.45,.55],[.68,.45,.55]];
function detectar(){
  const ahora=performance.now();
  if(video.currentTime!==ult&&video.videoWidth){ult=video.currentTime;cuadros++;
    const vw=video.videoWidth,vh=video.videoHeight;
    if(recorte.width!==640){recorte.width=640;recorte.height=Math.round(640*vh/vw)}
    if(!J.lm){const b=BUSQUEDA[buscar++%BUSQUEDA.length];zona={cx:b[0],cy:b[1],z:b[2]}}
    const z=zona.z,zx=lim(zona.cx-z/2,0,1-z),zy=lim(zona.cy-z/2,0,1-z);
    rc.drawImage(video,zx*vw,zy*vh,z*vw,z*vh,0,0,recorte.width,recorte.height);
    J.zona={x:zx,y:zy,z};
    const r=det.detectForVideo(recorte,ahora);
    if(r.landmarks&&r.landmarks.length){
      const lm=r.landmarks[0].map(p=>({x:zx+p.x*z,y:zy+p.y*z}));J.lm=lm;perdida=0;
      /* tamaño de la mano (muñeca a nudillo medio) en alto de imagen: grande = cerca, chico = lejos */
      const t=Math.hypot((lm[9].x-lm[0].x)*vw/vh,lm[9].y-lm[0].y);tamMano+=(t-tamMano)*.04;
      zona.z+=(lim(tamMano*5.5,.4,1)-zona.z)*.12;zona.cx+=(lm[9].x-zona.cx)*.2;zona.cy+=(lm[9].y-zona.cy)*.2;
      /* zona de juego según la distancia: lejos, mover poco la mano cubre toda la pantalla */
      const rw=lim(tamMano*vh/vw*7,.28,.78),rh=lim(rw*vw*innerHeight/(innerWidth*vh),.25,.85),cy=.46;
      const p=lm[8],nx=lim(((1-p.x)-(.5-rw/2))/rw,0,1),ny=lim((p.y-(cy-rh/2))/rh,0,1);
      J.juegoZona={rw,rh,cy};
      J.objetivo={x:fx.paso(nx*innerWidth,ahora),y:fy.paso(ny*innerHeight,ahora)};
    }else if(!perdida)perdida=ahora;
    if(perdida&&ahora-perdida>220){J.lm=null;J.objetivo=null;fx.reset();fy.reset()}
  }
  if(ahora-tFps>1000){J.fps=Math.round(cuadros*1000/(ahora-tFps));cuadros=0;tFps=ahora}
  if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(detectar);else requestAnimationFrame(detectar);
}
const bucle=detectar;
document.getElementById('camInicio').onclick=encender;
document.getElementById('camBarra').onclick=encender;
</script>
